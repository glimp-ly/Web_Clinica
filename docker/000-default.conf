<VirtualHost *:8989>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/frontend_clinica

    <Directory /var/www/frontend_clinica>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /api /var/www/backend_clinica/public
    <Directory /var/www/backend_clinica/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
